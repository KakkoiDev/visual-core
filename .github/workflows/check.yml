name: Check
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/validate.py
      - name: Unit, contract and command scenario tests (JUnit report)
        run: python3 tests/junit_run.py .test-output/unittest-junit.xml
      - name: Testing protocol (vendored test-core tools)
        run: |
          python3 tools/test-core/flaky_lint.py tests tests/browser.cjs tests/terrain-dependencies.cjs
          python3 tools/test-core/e2e_coverage.py --pages templates/web-app/index.html templates/component-kit/index.html --tests tests/browser.cjs
          python3 tools/test-core/scenarios.py check SCENARIOS.md --tests tests/test_scenarios.py tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittest-junit
          path: .test-output/unittest-junit.xml
  browser:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser --ignore-scripts
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH="$PWD/tests/browser/node_modules" node tests/browser.cjs
      - uses: actions/download-artifact@v4
        with:
          name: unittest-junit
          path: .test-output
      - name: Every scenario's test ran and passed
        run: python3 tools/test-core/scenarios.py check SCENARIOS.md --tests tests/test_scenarios.py tests/browser.cjs --junit .test-output/unittest-junit.xml .test-output/browser-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: .test-output/browser/
